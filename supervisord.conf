[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:createdb]
command=/app/.venv/bin/python manage.py createdb
directory=/app
user=root
autostart=true
autorestart=false
startsecs=0
exitcodes=0,1
stdout_logfile=/var/log/django/createdb.log
priority=1

[program:makemigrations]
command=/app/.venv/bin/python manage.py makemigrations --noinput
directory=/app
user=root
autostart=true
autorestart=false
startsecs=0
exitcodes=0,1
stdout_logfile=/var/log/django/migrate.log
priority=2

[program:migrate]
command=/app/.venv/bin/python manage.py migrate --noinput
directory=/app
user=root
autostart=true
autorestart=false
startsecs=0
exitcodes=0,1
stdout_logfile=/var/log/django/migrate.log
priority=3

[program:django]
command=/app/.venv/bin/python manage.py runserver 0.0.0.0:8014
directory=/app
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/django/django.log
environment=DJANGO_SETTINGS_MODULE="mailmanager.settings"
priority=4

[program:celery-worker]
command=/app/.venv/bin/celery -A mailmanager worker --loglevel=info --concurrency=1 -Q shizuha_mail
directory=/app
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/django/celery-worker.log
environment=DJANGO_SETTINGS_MODULE="mailmanager.settings"
priority=5

[program:celery-beat]
command=/app/.venv/bin/celery -A mailmanager beat --loglevel=info --scheduler=django_celery_beat.schedulers:DatabaseScheduler
directory=/app
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/django/celery-beat.log
environment=DJANGO_SETTINGS_MODULE="mailmanager.settings"
priority=6

[program:mcp-server]
command=/app/.venv/bin/python /app/mcp-server/mail_server.py --http-port 18114
directory=/app/mcp-server
user=root
autostart=true
autorestart=true
startsecs=3
startretries=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=SHIZUHA_MAIL_URL="http://localhost:8014",SHIZUHA_MCP_OAUTH_ENFORCE="true",SHIZUHA_OAUTH_ISSUER="https://shizuha.com/id",SHIZUHA_MCP_RESOURCE_URL="https://shizuha.com/mcp/mail"
priority=10

# MAIL-127/MAIL-128: self-scoped six-tool agent surface (§3; §2.1 keeps the
# full `mail` surface above untouched). Separate port + resource so the agent
# surface can carry its own audience-bound grants and read/send capability
# split without widening the full-mail contract.
[program:mail-agent-server]
command=/app/.venv/bin/python /app/mcp-server/mail_agent_server.py --http-port 18115
directory=/app/mcp-server
user=root
autostart=true
autorestart=true
startsecs=3
startretries=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=SHIZUHA_MAIL_URL="http://localhost:8014",SHIZUHA_MCP_OAUTH_ENFORCE="true",SHIZUHA_OAUTH_ISSUER="https://shizuha.com/id",SHIZUHA_MCP_RESOURCE_URL="https://shizuha.com/mcp/mail-agent"
priority=11

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
