# Shizuha Origin CI/CD — MULTI-ARCH build + deploy shizuha-mail frontend (PLAT-1009).
name: deploy-shizuha-mail-frontend
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
    paths:
      - frontend/**
      - .forgejo/workflows/deploy-frontend.yml
concurrency:
  group: deploy-shizuha-mail-frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: deploy-lane
    steps:
      - name: Checkout exact triggering revision for release guards
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install kubectl + cluster access
        run: |
          set -euo pipefail
          KUBECTL_ARCH=$(uname -m); case "$KUBECTL_ARCH" in x86_64) KUBECTL_ARCH=amd64;; aarch64) KUBECTL_ARCH=arm64;; esac
          curl -fsSL -o kubectl \
            "http://forgejo-http.origin.svc.cluster.local/api/packages/actions/generic/kubectl/v1.34.1/kubectl-${KUBECTL_ARCH}"
          install -m 0755 kubectl /usr/local/bin/kubectl
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Multi-arch build + deploy + verify (shizuha-mail-frontend)
        run: |
          set -euo pipefail
          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          FTAG="shizuha-mail-frontend-${SHORT}"
          REG="registry.registry.svc.cluster.local:5000"
          echo "Multi-arch build shizuha-mail-frontend:${FTAG} (amd64 + arm64)"

          # Cancelled Actions containers cannot remove Kubernetes Jobs they
          # created. Reap only superseded Mail frontend candidate artifacts
          # before creating the authoritative immutable tag.
          mapfile -t STALE_MAIL_FRONTEND_JOBS < <(
            kubectl get jobs -n build -o name | grep -E \
              '^job.batch/(ci-build-shizuha-mail-frontend-|ci-manifest-shizuha-mail-frontend-|ci-verify-shizuha-mail-frontend-)' || true
          )
          if [ "${#STALE_MAIL_FRONTEND_JOBS[@]}" -gt 0 ]; then
            kubectl delete -n build "${STALE_MAIL_FRONTEND_JOBS[@]}" --wait=true --timeout=120s
          fi

          render_build_job() {
            local ARCH="$1"
            cat <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ci-build-shizuha-mail-frontend-${SHORT}-${ARCH}
            namespace: build
            labels: { app: ci-build, service: shizuha-mail-frontend }
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 2100
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                nodeSelector: { kubernetes.io/arch: ${ARCH} }
                tolerations:
                  - { key: node.shizuha/workstation, operator: Exists, effect: NoSchedule }
                  - { key: shizuha.com/inference-paused, operator: Exists, effect: NoSchedule }
                  # amd64 kaniko on i9-ws times out pushing to registry ClusterIP;
                  # s1 overlay works and carries operator=unschedulable. CI tolerates
                  # the operator-hold taint instead of removing it.
                  - { key: operator, operator: Equal, value: unschedulable, effect: NoSchedule }
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                      - matchExpressions:
                        - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
                        # i9-ws overlay to ns registry is i/o timeout. Keep excluded until
                        # ClusterIP/FORWARD on i9-ws is actually fixed.
                        - { key: kubernetes.io/hostname, operator: NotIn, values: [i9-ws] }
                initContainers:
                  - name: git-clone
                    image: alpine/git:2.43.0
                    command: ["/bin/sh","-c"]
                    args:
                      - |
                        set -e
                        git clone --depth=50 http://x-token-auth:\${GIT_PASSWORD}@forgejo-http.origin.svc.cluster.local/shizuha-labs/mail.git /workspace/src
                        cd /workspace/src
                        git fetch --depth=50 origin ${{ github.sha }} || true
                        git checkout --detach ${{ github.sha }}
                    env:
                      - name: GIT_PASSWORD
                        valueFrom: { secretKeyRef: { name: forgejo-token, key: password } }
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                containers:
                  - name: kaniko
                    image: gcr.io/kaniko-project/executor:v1.23.2
                    args:
                      - --context=dir:///workspace/src
                      - --dockerfile=/workspace/src/frontend/Dockerfile.ci
                      - --destination=${REG}/shizuha-mail-frontend:${FTAG}-${ARCH}
                      - --insecure
                      - --skip-tls-verify
                      - --insecure-pull
                      - --registry-mirror=mirror-dockerhub.registry.svc.cluster.local:5000
                      - --build-arg=NPM_CONFIG_REGISTRY=http://npm-cache.registry.svc.cluster.local:4873/
                      - --build-arg=VITE_BASE_PATH=/mail/
                      - --build-arg=VITE_API_BASE=/mail/api
                      - --cache=true
                      - --cache-repo=${REG}/kaniko-cache/mail-deploy-frontend-${ARCH}
                      - --cache-copy-layers=true
                      - --cache-ttl=336h
                      - --compressed-caching=false
                      - --cleanup
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                volumes: [{ emptyDir: {}, name: workspace }]
          YAML
          }

          BUILD_GUARD_CONFIGMAP="origin-ci-build-guard-650fec631781"
          BUILD_GUARD_SHA256="650fec631781edce0e4980f0fb07b12ab78b67b1faf780b214d12a40f9dddcf6"
          BUILD_GUARD="${RUNNER_TEMP:-/tmp}/origin-ci-build-guard.py"
          kubectl get "configmap/${BUILD_GUARD_CONFIGMAP}" -n origin \
            -o jsonpath='{.data.guard\.py}' >"$BUILD_GUARD"
          echo "${BUILD_GUARD_SHA256}  ${BUILD_GUARD}" | sha256sum -c -
          job_name_for_arch() {
            local ARCH="$1"
            render_build_job "$ARCH" | awk '$1 == "name:" { print $2; exit }'
          }
          AMD64_JOB="$(job_name_for_arch amd64)"
          ARM64_JOB="$(job_name_for_arch arm64)"
          test -n "$AMD64_JOB" -a -n "$ARM64_JOB"
          cleanup_build_pair() {
            python3 "$BUILD_GUARD" cleanup \
              --namespace build --job "$AMD64_JOB" --job "$ARM64_JOB"
          }
          cleanup_on_failure() {
            rc=$?
            if [ "$rc" -ne 0 ]; then cleanup_build_pair || true; fi
            exit "$rc"
          }
          trap cleanup_on_failure EXIT INT TERM
          python3 "$BUILD_GUARD" preflight --arch amd64 --arch arm64
          cleanup_build_pair
          render_build_job amd64 | kubectl apply -f -
          render_build_job arm64 | kubectl apply -f -
          python3 "$BUILD_GUARD" wait-pair --namespace build \
            --job "amd64=${AMD64_JOB}" --job "arm64=${ARM64_JOB}" \
            --timeout-seconds 1800
          trap - EXIT INT TERM

          wait_job() {
            local ARCH="$1"
            local JOB="ci-build-shizuha-mail-frontend-${SHORT}-${ARCH}"
            kubectl wait -n build --for=condition=complete "job/${JOB}" --timeout=1800s &
            local WP=$!
            while kill -0 "$WP" 2>/dev/null; do
              if kubectl get "job/${JOB}" -n build -o jsonpath='{.status.failed}' | grep -q '[1-9]'; then
                echo "::error::kaniko frontend ${ARCH} build failed"
                kubectl logs -n build "job/${JOB}" --all-containers --tail=100 || true
                exit 1
              fi
              sleep 5
            done
            wait "$WP"
          }
          wait_job amd64 &
          AMD64_WAIT_PID=$!
          wait_job arm64 &
          ARM64_WAIT_PID=$!
          WAIT_STATUS=0
          wait "$AMD64_WAIT_PID" || WAIT_STATUS=$?
          wait "$ARM64_WAIT_PID" || WAIT_STATUS=$?
          [ "$WAIT_STATUS" -eq 0 ] || exit "$WAIT_STATUS"

          cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ci-manifest-shizuha-mail-frontend-${SHORT}
            namespace: build
            labels: { app: ci-manifest, service: shizuha-mail-frontend }
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 600
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: crane
                    image: gcr.io/go-containerregistry/crane:latest
                    args:
                      - index
                      - append
                      - --insecure
                      - -t
                      - ${REG}/shizuha-mail-frontend:${FTAG}
                      - -m
                      - ${REG}/shizuha-mail-frontend:${FTAG}-amd64
                      - -m
                      - ${REG}/shizuha-mail-frontend:${FTAG}-arm64
          YAML
          kubectl wait -n build --for=condition=complete "job/ci-manifest-shizuha-mail-frontend-${SHORT}" --timeout=300s || {
            echo "::error::frontend manifest combine failed"
            kubectl logs -n build "job/ci-manifest-shizuha-mail-frontend-${SHORT}" --tail=80 || true
            exit 1
          }

          verify_manifest() {
            local REPO="$1"
            local IMAGE_TAG="$2"
            local JOB="ci-verify-${REPO}-${SHORT}"
            cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: build
            labels: { app: ci-verify, service: ${REPO} }
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 300
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: manifest-check
                    image: python:3.12-alpine
                    command: ["python", "-c"]
                    args:
                      - |
                        import json, urllib.request
                        url = "http://${REG}/v2/${REPO}/manifests/${IMAGE_TAG}"
                        accept = ",".join(["application/vnd.oci.image.index.v1+json", "application/vnd.docker.distribution.manifest.list.v2+json"])
                        req = urllib.request.Request(url, headers={"Accept": accept})
                        with urllib.request.urlopen(req, timeout=30) as resp:
                            manifest = json.load(resp)
                        platforms = {f"{m.get('platform', {}).get('os')}/{m.get('platform', {}).get('architecture')}" for m in manifest.get("manifests", [])}
                        print(f"{url} platforms={sorted(platforms)}")
                        missing = {"linux/amd64", "linux/arm64"} - platforms
                        if missing:
                            raise SystemExit(f"missing required platform(s): {sorted(missing)}")
          YAML
            kubectl wait -n build --for=condition=complete "job/${JOB}" --timeout=120s || {
              echo "::error::manifest verification failed"
              kubectl logs -n build "job/${JOB}" --tail=80 || true
              exit 1
            }
            kubectl logs -n build "job/${JOB}" --tail=20 || true
          }
          verify_manifest "shizuha-mail-frontend" "${FTAG}"
          python3 .forgejo/scripts/verify_deploy_values_path.py
          set +e
          bash .forgejo/scripts/monotonic-release-guard.sh \
            shizuha shizuha-mail-frontend "${{ github.sha }}"
          GUARD_RC="$?"
          set -e
          if [ "${GUARD_RC}" = 10 ]; then exit 0; fi
          if [ "${GUARD_RC}" != 0 ]; then exit "${GUARD_RC}"; fi

          # The deploy chart is the sole desired-state authority, and the
          # central lifecycle is the sole Helm/workload writer. Promote the
          # immutable frontend candidate with optimistic locking.
          command -v helm >/dev/null 2>&1 || {
            HELM_ARCH="$(uname -m)"
            case "${HELM_ARCH}" in
              x86_64) HELM_ARCH=amd64 ;;
              aarch64|arm64) HELM_ARCH=arm64 ;;
              *) echo "::error::unsupported runner architecture: ${HELM_ARCH}"; exit 1 ;;
            esac
            curl -fsSL \
              "http://forgejo-http.origin.svc.cluster.local/api/packages/actions/generic/helm/v3.16.4/helm-v3.16.4-linux-${HELM_ARCH}.tar.gz" | tar xz
            install -m 0755 "linux-${HELM_ARCH}/helm" /usr/local/bin/helm
          }
          FGJO_URL="http://forgejo-http.origin.svc.cluster.local"
          FGJO_HOST="origin.shizuha.com"
          VALS_PATH="k3s%2Fcharts%2Fshizuha-mail%2Fvalues.yaml"
          VALS_URL="${FGJO_URL}/api/v1/repos/shizuha-labs/deploy/contents/${VALS_PATH}"
          PROMOTED=false
          for write_attempt in $(seq 1 10); do
            GET_CODE="$(curl -sS -o /tmp/mail-frontend-values-response.json -w '%{http_code}' \
              -H "Host: ${FGJO_HOST}" \
              -H "Authorization: token ${{ secrets.DEPLOY_PUSH_TOKEN }}" \
              "${VALS_URL}" || true)"
            test "${GET_CODE}" = 200 || {
              echo "::error::deploy values GET returned HTTP ${GET_CODE}"; exit 1;
            }
            FILE_SHA="$(python3 -c 'import json; print(json.load(open("/tmp/mail-frontend-values-response.json"))["sha"])')"
            python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          response = json.loads(Path("/tmp/mail-frontend-values-response.json").read_text())
          Path("/tmp/mail-frontend-values.yaml").write_bytes(base64.b64decode(response["content"]))
          PY
            CURRENT_FRONTEND_TAG="$(python3 .forgejo/scripts/deploy-values-path.py get /tmp/mail-frontend-values.yaml frontend.image.tag)"
            if [ "${CURRENT_FRONTEND_TAG}" = "${FTAG}" ]; then
              echo "deploy repo already desires ${FTAG}"
              break
            fi
            python3 .forgejo/scripts/deploy-values-path.py set \
              /tmp/mail-frontend-values.yaml frontend.image.tag "${FTAG}" >/dev/null
            NEW_B64="$(base64 -w0 < /tmp/mail-frontend-values.yaml)"
            BODY="$(python3 - "${FTAG}" "${NEW_B64}" "${FILE_SHA}" <<'PY'
          import json
          import sys

          print(json.dumps({
              "message": f"ci(shizuha-mail): desired frontend tag {sys.argv[1]} before rollout",
              "content": sys.argv[2],
              "sha": sys.argv[3],
              "branch": "master",
              "committer": {"email": "ci@shizuha.com", "name": "Origin CI"},
          }))
          PY
          )"
            PUT_CODE="$(curl -sS -o /tmp/mail-frontend-values-update.json -w '%{http_code}' \
              -X PUT -H "Host: ${FGJO_HOST}" \
              -H "Authorization: token ${{ secrets.DEPLOY_PUSH_TOKEN }}" \
              -H "Content-Type: application/json" \
              "${VALS_URL}" -d "${BODY}" || true)"
            case "${PUT_CODE}" in
              200|201)
                PROMOTED=true
                echo "deploy repo desired frontend tag updated to ${FTAG}"
                break
                ;;
              409|500|502|503)
                echo "deploy values changed concurrently; retrying fresh read after transient HTTP ${PUT_CODE} (${write_attempt}/10)"
                sleep 2
                ;;
              *)
                echo "::error::deploy values PUT returned HTTP ${PUT_CODE}" >&2
                exit 1
                ;;
            esac
          done

          GET_CODE="$(curl -sS -o /tmp/mail-frontend-values-final.json -w '%{http_code}' \
            -H "Host: ${FGJO_HOST}" \
            -H "Authorization: token ${{ secrets.DEPLOY_PUSH_TOKEN }}" \
            "${VALS_URL}" || true)"
          test "${GET_CODE}" = 200 || {
            echo "::error::deploy values verification GET returned HTTP ${GET_CODE}"; exit 1;
          }
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          response = json.loads(Path("/tmp/mail-frontend-values-final.json").read_text())
          Path("/tmp/mail-frontend-values-final.yaml").write_bytes(base64.b64decode(response["content"]))
          PY
          FINAL_FRONTEND_TAG="$(python3 .forgejo/scripts/deploy-values-path.py get /tmp/mail-frontend-values-final.yaml frontend.image.tag)"
          test "${FINAL_FRONTEND_TAG}" = "${FTAG}" || {
            echo "::error::deploy repo frontend tag ${FINAL_FRONTEND_TAG} != ${FTAG}"; exit 1;
          }

          # A rerun can find the tag already promoted after a lifecycle failure.
          # With no chart diff to emit another push event, explicitly redispatch.
          if [ "${PROMOTED}" != true ]; then
            DISPATCH_CODE="$(curl -sS -o /tmp/mail-frontend-lifecycle-dispatch.json -w '%{http_code}' \
              -X POST -H "Host: ${FGJO_HOST}" \
              -H "Authorization: token ${{ secrets.DEPLOY_PUSH_TOKEN }}" \
              -H 'Content-Type: application/json' \
              "${FGJO_URL}/api/v1/repos/shizuha-labs/deploy/actions/workflows/deploy-id-mail-lifecycle.yml/dispatches" \
              -d '{"ref":"master"}' || true)"
            test "${DISPATCH_CODE}" = 204 || {
              echo "::error::lifecycle dispatch returned HTTP ${DISPATCH_CODE}"; exit 1;
            }
            echo "central lifecycle reconcile dispatched for existing desired tag ${FTAG}"
          fi

          deployment_converged() {
            kubectl get deploy -n shizuha "$1" -o json 2>/dev/null | python3 -c '
          import json, sys
          deployment = json.load(sys.stdin)
          metadata, spec, status = deployment["metadata"], deployment["spec"], deployment.get("status", {})
          replicas = spec.get("replicas", 1)
          ok = (
              status.get("observedGeneration", 0) >= metadata.get("generation", 0)
              and status.get("updatedReplicas", 0) == replicas
              and status.get("availableReplicas", 0) == replicas
              and status.get("readyReplicas", 0) == replicas
          )
          raise SystemExit(0 if ok else 1)
          '
          }
          helm_owns_frontend() {
            helm get manifest shizuha-mail -n shizuha | python3 -c '
          import re
          import sys
          documents = sys.stdin.read().split("\n---")
          owned = any(
              re.search(r"(?m)^kind:\s*Deployment\s*$", document)
              and re.search(r"(?m)^\s*name:\s*shizuha-mail-frontend\s*$", document)
              for document in documents
          )
          raise SystemExit(0 if owned else 1)
          '
          }

          EXPECTED_FRONTEND_IMAGE="localhost:30500/shizuha-mail-frontend:${FTAG}"
          for attempt in $(seq 1 540); do
            GET_CODE="$(curl -sS -o /tmp/mail-frontend-values-current.json -w '%{http_code}' \
              -H "Host: ${FGJO_HOST}" \
              -H "Authorization: token ${{ secrets.DEPLOY_PUSH_TOKEN }}" \
              "${VALS_URL}" || true)"
            CHART_BACKEND_TAG=""
            CHART_FRONTEND_TAG=""
            if [ "${GET_CODE}" = 200 ]; then
              python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          response = json.loads(Path("/tmp/mail-frontend-values-current.json").read_text())
          Path("/tmp/mail-frontend-values-current.yaml").write_bytes(base64.b64decode(response["content"]))
          PY
              CHART_BACKEND_TAG="$(python3 .forgejo/scripts/deploy-values-path.py get /tmp/mail-frontend-values-current.yaml image.tag)"
              CHART_FRONTEND_TAG="$(python3 .forgejo/scripts/deploy-values-path.py get /tmp/mail-frontend-values-current.yaml frontend.image.tag)"
            fi
            if [ -n "${CHART_FRONTEND_TAG}" ] && [ "${CHART_FRONTEND_TAG}" != "${FTAG}" ]; then
              echo "Mail frontend desired state advanced to ${CHART_FRONTEND_TAG}; this run is superseded"
              exit 0
            fi
            EXPECTED_BACKEND_IMAGE="localhost:30500/shizuha-mail:${CHART_BACKEND_TAG}"
            LIVE_FRONTEND="$(kubectl get deploy -n shizuha shizuha-mail-frontend -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
            LIVE_BACKEND="$(kubectl get deploy -n shizuha shizuha-mail -o json | python3 -c 'import json,sys; deployment=json.load(sys.stdin); print(next(container["image"] for container in deployment["spec"]["template"]["spec"]["containers"] if container["name"] == "shizuha-mail"))' 2>/dev/null || true)"
            HELM_VALUES="$(helm get values shizuha-mail -n shizuha -o json 2>/dev/null || true)"
            STORED_BACKEND_TAG="$(printf '%s' "${HELM_VALUES}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("image",{}).get("tag",""))' 2>/dev/null || true)"
            STORED_FRONTEND_TAG="$(printf '%s' "${HELM_VALUES}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("frontend",{}).get("image",{}).get("tag",""))' 2>/dev/null || true)"
            STORED_FRONTEND_ENABLED="$(printf '%s' "${HELM_VALUES}" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("frontend",{}).get("enabled",False)).lower())' 2>/dev/null || true)"
            if [ "${CHART_FRONTEND_TAG}" = "${FTAG}" ] \
              && [ "${STORED_FRONTEND_ENABLED}" = true ] \
              && [ "${STORED_FRONTEND_TAG}" = "${CHART_FRONTEND_TAG}" ] \
              && [ "${STORED_BACKEND_TAG}" = "${CHART_BACKEND_TAG}" ] \
              && [ "${LIVE_FRONTEND}" = "${EXPECTED_FRONTEND_IMAGE}" ] \
              && [ "${LIVE_BACKEND}" = "${EXPECTED_BACKEND_IMAGE}" ] \
              && helm_owns_frontend \
              && deployment_converged shizuha-mail-frontend \
              && deployment_converged shizuha-mail; then
              echo "Chart, Helm ownership, frontend, and backend converged on attempt ${attempt}"
              break
            fi
            if [ "${attempt}" = 540 ]; then
              echo "::error::central lifecycle did not converge Mail frontend"; exit 1
            fi
            sleep 5
          done

          kubectl annotate -n shizuha deploy/shizuha-mail-frontend \
            shizuha.io/last-successful-sha="${{ github.sha }}" --overwrite
          kubectl get pods -n shizuha -l app=shizuha-mail-frontend
