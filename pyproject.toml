[project]
name = "shizuha-mail"
version = "0.1.0"
description = "Shizuha Mail service"
requires-python = ">=3.10,<3.13"
dependencies = [
  "Django>=5.2.15,<6.0",
  "djangorestframework>=3.14.0",
  "django-celery-beat>=2.5.0",
  "celery>=5.3.0",
  "redis>=4.5.0",
  "psycopg2-binary>=2.9.0",
  "django-cors-headers>=4.0.0",
  "requests>=2.31.0",
  "drf-spectacular>=0.27.0",
  "djangorestframework-simplejwt>=5.3.0",
  "django-allauth>=0.61.0",
  "dj-rest-auth>=5.0.0",
  "PyJWT>=2.14.0",
  "cryptography>=50.0.0",
  "httpx>=0.27.0",
  "mcp>=2.0.0",
  "supervisor>=4.2.5",
  "gunicorn==26.0.0",
]

[tool.uv]
package = false
exclude-newer = "7 days"
